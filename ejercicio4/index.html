<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Ejercicio 4</title>

    <link rel="stylesheet" href="./style.css">

</head>
<body>
    <h1>Calculo del índice de masa corporal</h1>
    <p>Ingrese su peso en kilogramos y su estatura en metros para calcular su IMC.</p>

    <div class="grupo">
        <label for="altura">Ingrese su estatura en cm</label>
        <input id="altura" type="number">
    </div>

    <div class="grupo">
        <label for="peso">Ingrese su peso en kg</label>
        <input id="peso" type="number">
    </div>

    <p id="pboton">Presione el boton para conocer su IMC</p>
    <button id="boton">Calcular</button>

    <script src="script.js"></script>
</body>
</html>
